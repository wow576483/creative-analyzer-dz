name: 3ARSI CI

on:
  push:
    branches: [main]
    paths: ['3arsi/**', '.github/workflows/3arsi-ci.yml']
  pull_request:
    paths: ['3arsi/**', '.github/workflows/3arsi-ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3arsi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build core engine
        run: npm run build:core

      - name: Test core engine
        run: npm run test

      - name: Type-check (core, api, web)
        run: npm run typecheck

      - name: Build web (Next.js)
        run: npm run build:web

      - name: Bundle API worker (wrangler dry run)
        run: npx wrangler deploy --dry-run --outdir=dist
        working-directory: 3arsi/apps/api
